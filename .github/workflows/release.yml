name: Release

# Push a tag like v1.2.0 (scripts/release.sh 1.2.0) to build, publish a GitHub Release,
# and update the Homebrew cask in cse-ariful/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Personal access token with write access to the tap repo (Settings → Secrets → Actions).
  # If it's missing, the release is still published; only the tap update is skipped.
  TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # scripts/manual_release.sh publishes the release itself; don't rebuild over it.
      - name: Skip if the release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (manual release) – skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Version from tag
        if: steps.check.outputs.skip != 'true'
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal app and DMG
        if: steps.check.outputs.skip != 'true'
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build_app.sh --dmg

      - name: Checksum
        if: steps.check.outputs.skip != 'true'
        id: sum
        run: |
          DMG="build/RunXcodeApp-${{ steps.v.outputs.version }}.dmg"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.sum.outputs.dmg }}" \
            --title "RunXcodeApp ${{ steps.v.outputs.version }}" \
            --generate-notes

      - name: Update Homebrew tap
        if: steps.check.outputs.skip != 'true' && env.TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cse-ariful/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
              packaging/homebrew/runxcodeapp.rb > tap/Casks/runxcodeapp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/runxcodeapp.rb
          git commit -m "runxcodeapp ${VERSION}" || { echo "Cask unchanged"; exit 0; }
          git push
